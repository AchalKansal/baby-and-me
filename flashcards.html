<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flashcards · Baby & Me</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; color: #fff; min-height: 100vh; overflow: hidden; }

  .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: rgba(0,0,0,0.8); position: absolute; top: 0; left: 0; right: 0; z-index: 10; }
  .back { text-decoration: none; color: #fff; font-size: 1.2rem; background: rgba(255,255,255,0.15); border-radius: 8px; padding: 4px 10px; }
  .topbar h2 { font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.8); }
  .topbar-right { display: flex; gap: 8px; align-items: center; }
  #auto-btn { background: rgba(255,255,255,0.15); border: none; color: white; font-size: 0.75rem; font-weight: 600; padding: 5px 12px; border-radius: 20px; cursor: pointer; font-family: inherit; }
  #auto-btn.on { background: rgba(255,255,255,0.35); }

  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  svg { max-width: min(100vw, 100vh); max-height: min(100vw, 100vh); width: 100%; height: 100%; }

  .label { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.7); padding: 6px 18px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; backdrop-filter: blur(4px); white-space: nowrap; }
  .dots { position: fixed; bottom: 54px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.25); }
  .dot.active { background: white; }

  .fade { animation: fadeIn 0.6s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">←</a>
  <h2>◼◻ High Contrast Cards</h2>
  <div class="topbar-right">
    <button id="auto-btn" onclick="toggleAuto()">Auto ▶</button>
  </div>
</div>

<div id="stage" onclick="nextCard()"></div>
<div class="dots" id="dots"></div>
<div class="label" id="label"></div>

<script>
const CARDS = [
  {
    name: 'Checkerboard',
    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      ${Array.from({length:8}, (_,r) => Array.from({length:8}, (_,c) =>
        `<rect x="${c*50}" y="${r*50}" width="50" height="50" fill="${(r+c)%2===0?'#000':'#fff'}"/>`
      ).join('')).join('')}
    </svg>`
  },
  {
    name: 'Bulls-Eye',
    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#fff"/>
      ${[180,150,120,90,60,30,10].map((r,i)=>`<circle cx="200" cy="200" r="${r}" fill="${i%2===0?'#000':'#fff'}"/>`).join('')}
    </svg>`
  },
  {
    name: 'Stripes',
    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#fff"/>
      ${Array.from({length:10}, (_,i)=>`<rect x="${i*40}" y="0" width="20" height="400" fill="#000"/>`).join('')}
    </svg>`
  },
  {
    name: 'Spiral',
    render: () => {
      let path = '';
      for (let i = 0; i < 720; i++) {
        const angle = (i * Math.PI) / 180;
        const r = i * 0.25;
        const x = 200 + r * Math.cos(angle);
        const y = 200 + r * Math.sin(angle);
        path += i === 0 ? `M${x},${y}` : `L${x},${y}`;
      }
      return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="400" fill="#fff"/>
        <path d="${path}" fill="none" stroke="#000" stroke-width="8" stroke-linecap="round"/>
      </svg>`;
    }
  },
  {
    name: 'Baby Face',
    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#fff"/>
      <circle cx="200" cy="200" r="160" fill="#000"/>
      <circle cx="200" cy="200" r="140" fill="#fff"/>
      <circle cx="150" cy="170" r="28" fill="#000"/>
      <circle cx="250" cy="170" r="28" fill="#000"/>
      <circle cx="158" cy="163" r="9" fill="#fff"/>
      <circle cx="258" cy="163" r="9" fill="#fff"/>
      <path d="M 145 240 Q 200 285 255 240" fill="none" stroke="#000" stroke-width="12" stroke-linecap="round"/>
      <circle cx="200" cy="145" r="6" fill="#000"/>
      <rect x="185" y="118" width="30" height="14" rx="7" fill="#000"/>
    </svg>`
  },
  {
    name: 'Triangles',
    render: () => {
      const tris = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const x = c * 100, y = r * 100;
          const fill = (r + c) % 2 === 0 ? '#000' : '#fff';
          const stroke = (r + c) % 2 === 0 ? '#fff' : '#000';
          tris.push(`<polygon points="${x},${y} ${x+100},${y} ${x+50},${y+100}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>`);
          tris.push(`<polygon points="${x},${y+100} ${x+100},${y+100} ${x+50},${y}" fill="${stroke}" stroke="${fill}" stroke-width="2"/>`);
        }
      }
      return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">${tris.join('')}</svg>`;
    }
  },
  {
    name: 'Star',
    render: () => {
      const pts = Array.from({length:10}, (_,i) => {
        const r = i%2===0 ? 160 : 70;
        const a = (i * 36 - 90) * Math.PI / 180;
        return `${200 + r*Math.cos(a)},${200 + r*Math.sin(a)}`;
      }).join(' ');
      return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="400" fill="#fff"/>
        <polygon points="${pts}" fill="#000"/>
      </svg>`;
    }
  },

      }
      return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="400" fill="#fff"/>

  {

    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#fff"/>

  },
  {
    name: 'Butterfly',
    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#fff"/>
      <!-- upper wings -->
      <ellipse cx="140" cy="170" rx="110" ry="90" fill="#000" transform="rotate(-20,140,170)"/>
      <ellipse cx="260" cy="170" rx="110" ry="90" fill="#000" transform="rotate(20,260,170)"/>
      <!-- wing patterns upper -->
      <ellipse cx="140" cy="168" rx="75" ry="60" fill="#fff" transform="rotate(-20,140,168)"/>
      <ellipse cx="260" cy="168" rx="75" ry="60" fill="#fff" transform="rotate(20,260,168)"/>
      <circle cx="145" cy="158" r="25" fill="#000"/>
      <circle cx="255" cy="158" r="25" fill="#000"/>
      <!-- lower wings -->
      <ellipse cx="145" cy="270" rx="85" ry="70" fill="#000" transform="rotate(15,145,270)"/>
      <ellipse cx="255" cy="270" rx="85" ry="70" fill="#000" transform="rotate(-15,255,270)"/>
      <ellipse cx="145" cy="270" rx="58" ry="48" fill="#fff" transform="rotate(15,145,270)"/>
      <ellipse cx="255" cy="270" rx="58" ry="48" fill="#fff" transform="rotate(-15,255,270)"/>
      <!-- body -->
      <ellipse cx="200" cy="210" rx="12" ry="80" fill="#000"/>
      <!-- antennae -->
      <path d="M194,140 Q175,95 165,75" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <circle cx="163" cy="73" r="7" fill="#000"/>
      <path d="M206,140 Q225,95 235,75" fill="none" stroke="#000" stroke-width="4" stroke-linecap="round"/>
      <circle cx="237" cy="73" r="7" fill="#000"/>
    </svg>`
  },
  {
    name: 'Flower',
    render: () => {
      const petals = Array.from({length:8}, (_,i) => {
        const a = (i * 45) * Math.PI / 180;
        const cx = 200 + 80*Math.cos(a), cy = 200 + 80*Math.sin(a);
        return `<ellipse cx="${cx}" cy="${cy}" rx="35" ry="50" fill="${i%2===0?'#000':'#333'}" transform="rotate(${i*45},${cx},${cy})"/>`;
      }).join('');
      return `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
        <rect width="400" height="400" fill="#fff"/>
        ${petals}
        <circle cx="200" cy="200" r="55" fill="#000"/>
        <circle cx="200" cy="200" r="35" fill="#fff"/>
        <circle cx="200" cy="200" r="18" fill="#000"/>
        <!-- stem -->
        <line x1="200" y1="345" x2="200" y2="260" stroke="#000" stroke-width="12" stroke-linecap="round"/>
        <!-- leaf -->
        <ellipse cx="175" cy="320" rx="28" ry="14" fill="#000" transform="rotate(-35,175,320)"/>
      </svg>`;
    }
  },
  {
    name: 'Heart',
    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#fff"/>
      <path d="M200,320 C200,320 60,235 60,150 C60,105 95,75 140,75 C165,75 185,88 200,105 C215,88 235,75 260,75 C305,75 340,105 340,150 C340,235 200,320 200,320 Z" fill="#000"/>
      <!-- inner heart highlight -->

      <path d="M200,270 C200,270 115,210 115,158 C115,138 128,120 148,120 C162,120 175,130 200,155 C225,130 238,120 252,120 C272,120 285,138 285,158 C285,210 200,270 200,270 Z" fill="#000"/>
    </svg>`
  },
  {
    name: 'Bird',
    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#fff"/>

      <ellipse cx="195" cy="230" rx="100" ry="75" fill="#000"/>
      <!-- head -->
      <circle cx="130" cy="160" r="65" fill="#000"/>
      <!-- wing -->
      <path d="M170,215 Q250,165 320,190 Q270,230 220,245 Z" fill="#000"/>
      <path d="M175,215 Q245,170 308,193 Q262,225 222,240 Z" fill="#fff"/>
      <!-- tail -->
      <path d="M285,245 L340,290 L320,300 L310,260 L300,305 L285,255 Z" fill="#000"/>
      <!-- eye -->
      <circle cx="118" cy="152" r="18" fill="#fff"/>
      <circle cx="118" cy="152" r="11" fill="#000"/>
      <circle cx="114" cy="148" r="4" fill="#fff"/>
      <!-- beak -->
      <polygon points="78,168 52,178 78,188" fill="#000"/>
      <polygon points="78,168 55,178 78,183" fill="#fff"/>

      <line x1="175" y1="300" x2="165" y2="340" stroke="#000" stroke-width="6"/>
      <line x1="165" y1="340" x2="148" y2="355" stroke="#000" stroke-width="5"/>
      <line x1="165" y1="340" x2="168" y2="360" stroke="#000" stroke-width="5"/>

      <line x1="225" y1="340" x2="208" y2="355" stroke="#000" stroke-width="5"/>
      <line x1="225" y1="340" x2="228" y2="360" stroke="#000" stroke-width="5"/>
      <line x1="225" y1="340" x2="242" y2="358" stroke="#000" stroke-width="5"/>

  },
  {
    name: 'Bear',
    render: () => `<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#fff"/>
      <!-- body -->
      <ellipse cx="200" cy="275" rx="120" ry="105" fill="#000"/>
      <!-- belly -->

      <circle cx="200" cy="155" r="90" fill="#000"/>

      <circle cx="128" cy="82" r="38" fill="#000"/>

      <circle cx="170" cy="143" r="18" fill="#fff"/>

    </svg>`
  }
];

let current = 0, autoPlay = false, autoTimer = null;

function renderDots() {
  document.getElementById('dots').innerHTML = CARDS.map((_,i) =>
    `<div class="dot${i===current?' active':''}"></div>`).join('');
}

function showCard(i) {
  current = ((i % CARDS.length) + CARDS.length) % CARDS.length;
  const stage = document.getElementById('stage');
  stage.innerHTML = CARDS[current].render();
  stage.classList.remove('fade');
  void stage.offsetWidth;
  stage.classList.add('fade');
  document.getElementById('label').textContent = CARDS[current].name;
  renderDots();
}

function nextCard() {
  showCard(current + 1);
  if (autoPlay) { clearInterval(autoTimer); autoTimer = setInterval(nextCard, 4000); }
}

function toggleAuto() {
  autoPlay = !autoPlay;
  const btn = document.getElementById('auto-btn');
  btn.textContent = autoPlay ? 'Auto ⏸' : 'Auto ▶';
  btn.classList.toggle('on', autoPlay);
  clearInterval(autoTimer);
  if (autoPlay) autoTimer = setInterval(nextCard, 4000);
}

showCard(0);
</script>
</body>
</html>
