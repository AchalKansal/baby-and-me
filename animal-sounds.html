<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Animal Sounds · Baby & Me</title>
<style>
  :root {
    --green: #4CAF50; --green-l: #E8F5E9; --bg: #F1FFF3;
    --white: #fff; --text: #2d4a2d; --muted: #7a9a7a;
    --shadow: 0 3px 14px rgba(0,0,0,0.09); --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); min-height: 100vh; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding-bottom: 80px; }

  .topbar {
    display: flex; align-items: center; gap: 12px; padding: 14px 18px;
    background: var(--white); box-shadow: 0 1px 8px rgba(0,0,0,0.07);
    position: sticky; top: 0; z-index: 10;
  }
  .back { text-decoration: none; color: var(--green); font-size: 1.4rem; line-height: 1; }
  .topbar h2 { font-size: 1rem; font-weight: 700; }

  .wrap { max-width: 540px; margin: 0 auto; padding: 16px; }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 6px 16px; border-radius: 20px;
    border: 2px solid #cde8cd; background: var(--white);
    font-size: 0.78rem; font-weight: 700; cursor: pointer;
    color: var(--muted); font-family: inherit; transition: all 0.15s;
  }
  .tab.on { background: var(--green); border-color: var(--green); color: #fff; }

  .grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
  }

  .acard {
    background: var(--white); border-radius: var(--radius);
    box-shadow: var(--shadow); cursor: pointer; overflow: hidden;
    border: 3px solid transparent; transition: transform 0.12s;
    -webkit-tap-highlight-color: transparent; user-select: none;
  }
  .acard:active { transform: scale(0.94); }
  .acard.on { border-color: var(--green); box-shadow: 0 0 0 4px rgba(76,175,80,0.2); }

  .acard-top {
    background: var(--green-l); display: flex; align-items: center;
    justify-content: center; padding: 16px 8px 12px;
    position: relative;
  }
  .acard.on .acard-top { background: #c8e6c9; }

  .aemoji { font-size: 3rem; line-height: 1; display: block; transition: transform 0.2s; }
  .acard.on .aemoji { transform: scale(1.18); }

  .waves {
    position: absolute; bottom: 6px; right: 6px;
    display: flex; gap: 2px; align-items: flex-end; height: 16px;
    opacity: 0; transition: opacity 0.2s;
  }
  .acard.on .waves { opacity: 1; }
  .wave-bar {
    width: 3px; background: var(--green); border-radius: 2px;
  }
  .wave-bar:nth-child(1) { height: 5px;  animation: wb 0.5s 0s    ease-in-out infinite alternate; }
  .wave-bar:nth-child(2) { height: 11px; animation: wb 0.5s 0.1s  ease-in-out infinite alternate; }
  .wave-bar:nth-child(3) { height: 7px;  animation: wb 0.5s 0.2s  ease-in-out infinite alternate; }
  .wave-bar:nth-child(4) { height: 13px; animation: wb 0.5s 0.05s ease-in-out infinite alternate; }
  @keyframes wb { from { transform: scaleY(0.35); } to { transform: scaleY(1); } }

  .acard-info { padding: 8px 8px 10px; text-align: center; }
  .aname { display: block; font-size: 0.8rem; font-weight: 800; color: var(--text); }
  .asound { display: block; font-size: 0.68rem; color: var(--muted); margin-top: 1px; }

  .now-bar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
    background: var(--green); color: #fff;
    padding: 12px 18px; display: flex; align-items: center; gap: 12px;
    transform: translateY(100%); transition: transform 0.28s ease;
    box-shadow: 0 -4px 20px rgba(76,175,80,0.3);
  }
  .now-bar.show { transform: translateY(0); }
  .nb-emoji { font-size: 2rem; flex-shrink: 0; }
  .nb-text { flex: 1; min-width: 0; }
  .nb-name  { font-size: 0.9rem; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nb-sound { font-size: 0.75rem; opacity: 0.85; }
  .nb-stop {
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,0.25); color: #fff;
    font-size: 1rem; cursor: pointer; flex-shrink: 0; line-height: 36px; text-align: center;
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="index.html" class="back">←</a>
  <h2>🐾 Animal Sounds</h2>
</div>

<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="now-bar" id="now-bar">
  <span class="nb-emoji" id="nb-emoji"></span>
  <div class="nb-text">
    <div class="nb-name"  id="nb-name"></div>
    <div class="nb-sound" id="nb-sound"></div>
  </div>
  <button class="nb-stop" onclick="stopAll()">■</button>
</div>

<script>
/* ── Data ─────────────────────────────────────────────── */
var CATS = {
  'Farm': [
    { e:'🐄', n:'Cow',     s:'Moo!',          t:'moo'    },
    { e:'🐷', n:'Pig',     s:'Oink oink!',    t:'oink'   },
    { e:'🐔', n:'Chicken', s:'Cluck cluck!',  t:'cluck'  },
    { e:'🐑', n:'Sheep',   s:'Baa baa!',      t:'baa'    },
    { e:'🐴', n:'Horse',   s:'Neigh!',        t:'neigh'  },
    { e:'🦆', n:'Duck',    s:'Quack quack!',  t:'quack'  },
    { e:'🐓', n:'Rooster', s:'Cock-a-doodle!',t:'crow'   },
    { e:'🐐', n:'Goat',    s:'Meh meh!',      t:'baa2'   },
  ],
  'Wild': [
    { e:'🦁', n:'Lion',     s:'Roaar!',     t:'roar'     },
    { e:'🐘', n:'Elephant', s:'Toot!',      t:'trumpet'  },
    { e:'🐯', n:'Tiger',    s:'Grrr!',      t:'roar2'    },
    { e:'🐺', n:'Wolf',     s:'Howl!',      t:'howl'     },
    { e:'🦊', n:'Fox',      s:'Yip yip!',   t:'yip'      },
    { e:'🐻', n:'Bear',     s:'Growl!',     t:'growl'    },
    { e:'🐒', n:'Monkey',   s:'Ooh ooh!',   t:'monkey'   },
    { e:'🐊', n:'Croc',     s:'Hiss!',      t:'hiss'     },
  ],
  'Pets': [
    { e:'🐱', n:'Cat',     s:'Meow!',        t:'meow'   },
    { e:'🐶', n:'Dog',     s:'Woof woof!',   t:'bark'   },
    { e:'🐰', n:'Rabbit',  s:'Squeak!',      t:'squeak' },
    { e:'🐹', n:'Hamster', s:'Squeak squeak!',t:'squeak2'},
    { e:'🦜', n:'Parrot',  s:'Tweet tweet!', t:'chirp'  },
    { e:'🐢', n:'Turtle',  s:'Hiss…',        t:'hiss2'  },
    { e:'🐠', n:'Fish',    s:'Blub blub!',   t:'blub'   },
  ],
  'Birds': [
    { e:'🐦', n:'Bird',    s:'Tweet tweet!', t:'chirp'    },
    { e:'🦅', n:'Eagle',   s:'Screech!',     t:'screech'  },
    { e:'🦉', n:'Owl',     s:'Hoo hoo!',     t:'hoot'     },
    { e:'🐧', n:'Penguin', s:'Squawk!',      t:'squawk'   },
    { e:'🦢', n:'Swan',    s:'Honk honk!',   t:'honk'     },
    { e:'🐤', n:'Chick',   s:'Cheep cheep!', t:'cheep'    },
    { e:'🦩', n:'Flamingo',s:'Honk!',        t:'honk2'    },
  ],
  'Sea': [
    { e:'🐬', n:'Dolphin', s:'Eee-eee!',   t:'dolphin' },
    { e:'🐋', n:'Whale',   s:'Woooo…',     t:'whale'   },
    { e:'🦭', n:'Seal',    s:'Arf arf!',   t:'seal'    },
    { e:'🦀', n:'Crab',    s:'Click!',     t:'click'   },
    { e:'🐙', n:'Octopus', s:'Blub…',      t:'blub2'   },
  ],
};

/* ── Audio ────────────────────────────────────────────── */
var ac = null;

function getAc() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}

function tone(ac, type, freq, start, dur, vol) {
  var osc = ac.createOscillator();
  var g   = ac.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  osc.connect(g);
  g.connect(ac.destination);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(vol, start + 0.02);
  g.gain.setValueAtTime(vol, start + dur * 0.75);
  g.gain.linearRampToValueAtTime(0, start + dur);
  osc.start(start);
  osc.stop(start + dur + 0.02);
  return osc;
}

function sweep(ac, type, f0, f1, start, dur, vol) {
  var osc = ac.createOscillator();
  var g   = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(f0, start);
  osc.frequency.linearRampToValueAtTime(f1, start + dur);
  osc.connect(g);
  g.connect(ac.destination);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(vol, start + 0.03);
  g.gain.setValueAtTime(vol, start + dur * 0.8);
  g.gain.linearRampToValueAtTime(0, start + dur);
  osc.start(start);
  osc.stop(start + dur + 0.02);
  return osc;
}

function noise(ac, loFreq, hiFreq, start, dur, vol) {
  var bufLen = Math.floor(ac.sampleRate * dur);
  var buf = ac.createBuffer(1, bufLen, ac.sampleRate);
  var data = buf.getChannelData(0);
  for (var i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1);
  var src = ac.createBufferSource();
  src.buffer = buf;
  var lo  = ac.createBiquadFilter(); lo.type  = 'highpass';  lo.frequency.value = loFreq;
  var hi  = ac.createBiquadFilter(); hi.type  = 'lowpass';   hi.frequency.value = hiFreq;
  var g   = ac.createGain();
  src.connect(lo); lo.connect(hi); hi.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(vol, start + 0.02);
  g.gain.setValueAtTime(vol, start + dur * 0.75);
  g.gain.linearRampToValueAtTime(0, start + dur);
  src.start(start); src.stop(start + dur + 0.02);
  return src;
}

function vibrato(ac, type, freq, vibRate, vibDepth, start, dur, vol) {
  var osc  = ac.createOscillator();
  var lfo  = ac.createOscillator();
  var lfoG = ac.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  lfo.frequency.value = vibRate;
  lfoG.gain.value     = vibDepth;
  lfo.connect(lfoG);
  lfoG.connect(osc.frequency);
  var g = ac.createGain();
  osc.connect(g); g.connect(ac.destination);
  g.gain.setValueAtTime(0, start);
  g.gain.linearRampToValueAtTime(vol, start + 0.04);
  g.gain.setValueAtTime(vol, start + dur * 0.8);
  g.gain.linearRampToValueAtTime(0, start + dur);
  osc.start(start); osc.stop(start + dur + 0.02);
  lfo.start(start); lfo.stop(start + dur + 0.02);
}

function playSound(type) {
  var a = getAc();
  var t = a.currentTime;

  switch (type) {
    case 'moo':
      sweep(a, 'sawtooth', 150, 110, t,       0.8, 0.4);
      vibrato(a, 'sine',   130, 5, 8,    t+0.1, 0.7, 0.2);
      break;
    case 'oink':
      sweep(a, 'triangle', 380, 320, t,      0.2, 0.45);
      sweep(a, 'triangle', 380, 320, t+0.3,  0.2, 0.45);
      break;
    case 'cluck':
      sweep(a, 'square',   900, 500, t,      0.12, 0.3);
      sweep(a, 'square',   750, 450, t+0.18, 0.12, 0.3);
      sweep(a, 'square',   820, 480, t+0.36, 0.12, 0.3);
      break;
    case 'baa':
      vibrato(a, 'triangle', 290, 9, 18,  t, 0.65, 0.45);
      break;
    case 'baa2':
      vibrato(a, 'triangle', 340, 10, 20, t, 0.65, 0.4);
      break;
    case 'neigh':
      sweep(a, 'sawtooth', 700, 450, t,      0.35, 0.4);
      sweep(a, 'sawtooth', 900, 300, t+0.38, 0.55, 0.35);
      break;
    case 'quack':
      sweep(a, 'sawtooth', 500, 380, t,      0.18, 0.4);
      sweep(a, 'sawtooth', 500, 380, t+0.28, 0.18, 0.4);
      break;
    case 'crow':
      sweep(a, 'sawtooth', 450, 600, t,      0.22, 0.35);
      sweep(a, 'sawtooth', 550, 750, t+0.28, 0.22, 0.35);
      sweep(a, 'sawtooth', 500, 680, t+0.58, 0.28, 0.35);
      break;
    case 'roar':
      noise(a, 40,  400, t, 1.2, 0.6);
      sweep(a, 'sawtooth', 80, 55, t, 1.0, 0.35);
      break;
    case 'roar2':
      noise(a, 60,  500, t, 0.9, 0.55);
      sweep(a, 'sawtooth', 100, 70, t, 0.8, 0.3);
      break;
    case 'trumpet':
      sweep(a, 'sawtooth', 180, 600, t,      0.4,  0.5);
      sweep(a, 'sawtooth', 600, 200, t+0.45, 0.55, 0.45);
      break;
    case 'howl':
      sweep(a, 'sine', 220, 380, t,      0.5,  0.45);
      sweep(a, 'sine', 380, 240, t+0.55, 0.65, 0.4);
      break;
    case 'yip':
      sweep(a, 'sine', 650, 850, t,      0.12, 0.4);
      sweep(a, 'sine', 650, 850, t+0.22, 0.12, 0.4);
      sweep(a, 'sine', 700, 900, t+0.44, 0.12, 0.4);
      break;
    case 'growl':
      noise(a, 30, 280, t, 1.0, 0.55);
      vibrato(a, 'sawtooth', 90, 7, 10, t, 0.9, 0.2);
      break;
    case 'monkey':
      sweep(a, 'sine', 500, 800, t,      0.15, 0.4);
      sweep(a, 'sine', 500, 800, t+0.22, 0.15, 0.4);
      sweep(a, 'sine', 450, 750, t+0.44, 0.18, 0.4);
      break;
    case 'hiss':
    case 'hiss2':
      noise(a, 1500, 6000, t, 0.75, 0.5);
      break;
    case 'meow':
      sweep(a, 'sine', 650, 820, t,      0.25, 0.35);
      sweep(a, 'sine', 820, 680, t+0.28, 0.35, 0.35);
      break;
    case 'bark':
      sweep(a, 'square', 520, 380, t,      0.18, 0.45);
      sweep(a, 'square', 520, 380, t+0.28, 0.18, 0.45);
      break;
    case 'squeak':
    case 'squeak2':
      sweep(a, 'sine', 900,  1200, t,      0.1, 0.35);
      sweep(a, 'sine', 1000, 1300, t+0.18, 0.1, 0.35);
      break;
    case 'chirp':
    case 'cheep':
      sweep(a, 'sine', 1000, 1200, t,      0.1, 0.35);
      sweep(a, 'sine', 1100, 1300, t+0.18, 0.1, 0.35);
      sweep(a, 'sine', 950,  1150, t+0.36, 0.1, 0.35);
      break;
    case 'blub':
    case 'blub2':
      sweep(a, 'sine', 500, 300, t,      0.15, 0.35);
      sweep(a, 'sine', 500, 300, t+0.25, 0.15, 0.35);
      sweep(a, 'sine', 500, 300, t+0.5,  0.15, 0.35);
      break;
    case 'screech':
      sweep(a, 'sawtooth', 700, 1100, t, 0.55, 0.45);
      break;
    case 'hoot':
      tone(a, 'sine', 380, t,      0.3, 0.4);
      tone(a, 'sine', 360, t+0.45, 0.3, 0.4);
      break;
    case 'squawk':
      sweep(a, 'sawtooth', 500, 750, t,      0.22, 0.4);
      sweep(a, 'sawtooth', 450, 700, t+0.32, 0.22, 0.4);
      break;
    case 'honk':
    case 'honk2':
      tone(a, 'sawtooth', 350, t,      0.25, 0.4);
      tone(a, 'sawtooth', 380, t+0.38, 0.25, 0.4);
      break;
    case 'dolphin':
      sweep(a, 'sine', 1100, 1500, t,      0.18, 0.38);
      sweep(a, 'sine', 1300, 900,  t+0.25, 0.22, 0.38);
      break;
    case 'whale':
      sweep(a, 'sine', 55, 80, t,      0.9,  0.4);
      sweep(a, 'sine', 80, 50, t+1.0, 0.75, 0.35);
      break;
    case 'seal':
      sweep(a, 'sawtooth', 480, 380, t,      0.2, 0.4);
      sweep(a, 'sawtooth', 480, 380, t+0.32, 0.2, 0.4);
      break;
    case 'click':
      for (var i = 0; i < 5; i++) {
        tone(a, 'square', 700 + i * 60, t + i * 0.08, 0.04, 0.4);
      }
      break;
    default:
      tone(a, 'sine', 440, t, 0.4, 0.35);
  }
}

/* ── UI ───────────────────────────────────────────────── */
var currentCat  = Object.keys(CATS)[0];
var currentCard = null;

function stopAll() {
  if (currentCard) { currentCard.classList.remove('on'); currentCard = null; }
  document.getElementById('now-bar').classList.remove('show');
}

function play(card, animal) {
  stopAll();
  try { playSound(animal.t); } catch(err) { console.warn('sound error', err); }
  card.classList.add('on');
  currentCard = card;
  document.getElementById('nb-emoji').textContent  = animal.e;
  document.getElementById('nb-name').textContent   = animal.n;
  document.getElementById('nb-sound').textContent  = animal.s;
  document.getElementById('now-bar').classList.add('show');

  // auto-clear after ~2s
  setTimeout(function() {
    if (currentCard === card) stopAll();
  }, 2200);
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  Object.keys(CATS).forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'tab' + (cat === currentCat ? ' on' : '');
    btn.textContent = cat;
    btn.onclick = function() {
      currentCat = cat;
      document.querySelectorAll('.tab').forEach(function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      stopAll();
      renderGrid();
    };
    el.appendChild(btn);
  });
}

function renderGrid() {
  var el = document.getElementById('grid');
  el.innerHTML = '';
  CATS[currentCat].forEach(function(animal) {
    var card = document.createElement('div');
    card.className = 'acard';
    card.innerHTML =
      '<div class="acard-top">' +
        '<span class="aemoji">' + animal.e + '</span>' +
        '<div class="waves">' +
          '<div class="wave-bar"></div>' +
          '<div class="wave-bar"></div>' +
          '<div class="wave-bar"></div>' +
          '<div class="wave-bar"></div>' +
        '</div>' +
      '</div>' +
      '<div class="acard-info">' +
        '<span class="aname">' + animal.n + '</span>' +
        '<span class="asound">' + animal.s + '</span>' +
      '</div>';

    card.addEventListener('click', function() {
      play(card, animal);
    });

    el.appendChild(card);
  });
}

renderTabs();
renderGrid();
</script>
</body>
</html>
