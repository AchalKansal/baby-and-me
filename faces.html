<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Faces · Baby & Me</title>
<style>
  :root { --bg: #FFF9F5; --pp: #FF7B54; --text: #3D3D3D; --muted: #999; --white: #fff; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text); min-height: 100vh;
    display: flex; flex-direction: column;
    touch-action: manipulation; user-select: none;
  }
  .topbar {
    display: flex; align-items: center; gap: 14px; padding: 16px 20px;
    background: var(--white); box-shadow: 0 1px 8px rgba(0,0,0,0.06);
    flex-shrink: 0;
  }
  .back { text-decoration: none; color: var(--pp); font-size: 1.4rem; }
  .topbar h2 { font-size: 1rem; font-weight: 700; }

  .stage {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 20px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .face-wrap {
    width: min(80vw, 340px);
    height: min(80vw, 340px);
    transition: transform 0.18s cubic-bezier(.34,1.56,.64,1);
  }
  .face-wrap.bounce { animation: faceIn 0.35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes faceIn {
    0% { transform: scale(0.7); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .face-label {
    margin-top: 20px;
    font-size: 1.6rem;
    font-weight: 900;
    letter-spacing: -0.5px;
    transition: color 0.3s;
    text-align: center;
  }
  .face-sub {
    margin-top: 6px;
    font-size: 0.9rem;
    color: var(--muted);
    text-align: center;
  }

  .dots {
    display: flex; gap: 8px; margin-top: 24px;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #ddd; transition: background 0.2s, transform 0.2s;
  }
  .dot.active { transform: scale(1.4); }

  .hint { font-size: 0.78rem; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="back" onclick="history.back();return false;">←</a>
  <h2>😊 Faces</h2>
</div>

<div class="stage" id="stage" onclick="nextFace()">
  <div class="face-wrap" id="faceWrap">
    <svg id="faceSvg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"></svg>
  </div>
  <div class="face-label" id="faceLabel"></div>
  <div class="face-sub" id="faceSub"></div>
  <div class="dots" id="dots"></div>
  <div class="hint">Tap anywhere to see a new face!</div>
</div>

<script>
var ac = null;
function getAc() {
  if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function playChime(freq) {
  try {
    var a = getAc();
    var osc = a.createOscillator();
    var gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.35, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + 0.5);
    osc.start(a.currentTime);
    osc.stop(a.currentTime + 0.55);
  } catch(e) {}
}

// SVG face builder helpers
function circle(cx, cy, r, fill, stroke, sw) {
  return '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + (fill||'none') + '" stroke="' + (stroke||'none') + '" stroke-width="' + (sw||0) + '"/>';
}
function ellipse(cx, cy, rx, ry, fill, stroke, sw) {
  return '<ellipse cx="' + cx + '" cy="' + cy + '" rx="' + rx + '" ry="' + ry + '" fill="' + (fill||'none') + '" stroke="' + (stroke||'none') + '" stroke-width="' + (sw||0) + '"/>';
}
function path(d, fill, stroke, sw, linecap) {
  return '<path d="' + d + '" fill="' + (fill||'none') + '" stroke="' + (stroke||'none') + '" stroke-width="' + (sw||0) + '" stroke-linecap="' + (linecap||'round') + '"/>';
}
function rect(x,y,w,h,rx,fill) {
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="'+(rx||0)+'" fill="'+(fill||'none')+'"/>';
}

var FACES = [
  {
    label: 'Happy! 😄',
    sub: 'Baby loves smiles!',
    bg: '#FFE066',
    color: '#FF7B54',
    sound: 523,
    svg: function(bg) {
      return '<circle cx="100" cy="100" r="90" fill="' + bg + '" stroke="#333" stroke-width="5"/>'
        + circle(72, 85, 12, '#333')
        + circle(128, 85, 12, '#333')
        + circle(75, 82, 4, '#fff')
        + circle(131, 82, 4, '#fff')
        + path('M 60 115 Q 100 155 140 115', 'none', '#333', 6)
        + circle(62, 118, 10, '#FF9999', 'none', 0)
        + circle(138, 118, 10, '#FF9999', 'none', 0);
    }
  },
  {
    label: 'Surprised! 😲',
    sub: 'Peek-a-boo!',
    bg: '#B5EAD7',
    color: '#2D8B6A',
    sound: 659,
    svg: function(bg) {
      return '<circle cx="100" cy="100" r="90" fill="' + bg + '" stroke="#333" stroke-width="5"/>'
        + circle(72, 82, 14, '#fff', '#333', 4)
        + circle(128, 82, 14, '#fff', '#333', 4)
        + circle(72, 82, 7, '#333')
        + circle(128, 82, 7, '#333')
        + circle(73, 80, 2, '#fff')
        + circle(129, 80, 2, '#fff')
        + ellipse(100, 125, 16, 20, '#fff', '#333', 4)
        + path('M 85 60 Q 72 50 65 58', 'none', '#333', 4)
        + path('M 115 60 Q 128 50 135 58', 'none', '#333', 4);
    }
  },
  {
    label: 'Silly! 😜',
    sub: 'Funny faces!',
    bg: '#FFDAC1',
    color: '#E05C00',
    sound: 440,
    svg: function(bg) {
      return '<circle cx="100" cy="100" r="90" fill="' + bg + '" stroke="#333" stroke-width="5"/>'
        + circle(72, 85, 12, '#333')
        + circle(128, 85, 12, '#333')
        + circle(75, 82, 4, '#fff')
        + circle(131, 82, 4, '#fff')
        + path('M 60 115 Q 100 145 140 115', 'none', '#333', 5)
        + ellipse(100, 140, 12, 8, '#FF5577', 'none', 0)
        + path('M 85 140 L 115 140', 'none', '#fff', 3)
        + ellipse(100, 150, 18, 8, '#FF99AA', 'none', 0)
        + circle(62, 118, 10, '#FFB3B3', 'none', 0)
        + circle(138, 118, 10, '#FFB3B3', 'none', 0)
        + path('M 78 115 L 72 125 L 66 115', 'none', '#FF5577', 3, 'square');
    }
  },
  {
    label: 'Sleepy 😴',
    sub: 'Time for a nap…',
    bg: '#C7CEEA',
    color: '#3B3F87',
    sound: 330,
    svg: function(bg) {
      return '<circle cx="100" cy="100" r="90" fill="' + bg + '" stroke="#333" stroke-width="5"/>'
        + path('M 60 85 Q 72 75 84 85', 'none', '#333', 5)
        + path('M 116 85 Q 128 75 140 85', 'none', '#333', 5)
        + path('M 65 115 Q 100 135 135 115', 'none', '#333', 5)
        + circle(62, 118, 8, '#C7A0B0', 'none', 0)
        + circle(138, 118, 8, '#C7A0B0', 'none', 0)
        + '<text x="148" y="75" font-size="22" fill="#8888CC">z</text>'
        + '<text x="158" y="58" font-size="16" fill="#AAAADD">z</text>'
        + '<text x="165" y="44" font-size="12" fill="#CCCCEE">z</text>';
    }
  },
  {
    label: 'Excited! 🤩',
    sub: 'So much to see!',
    bg: '#FFD6FF',
    color: '#AA00CC',
    sound: 784,
    svg: function(bg) {
      return '<circle cx="100" cy="100" r="90" fill="' + bg + '" stroke="#333" stroke-width="5"/>'
        + '<text x="68" y="96" font-size="28" text-anchor="middle" fill="#FFD700">★</text>'
        + '<text x="132" y="96" font-size="28" text-anchor="middle" fill="#FFD700">★</text>'
        + path('M 58 118 Q 100 158 142 118', 'none', '#333', 6)
        + circle(62, 122, 12, '#FFB3D9', 'none', 0)
        + circle(138, 122, 12, '#FFB3D9', 'none', 0)
        + '<text x="100" y="66" font-size="14" text-anchor="middle" fill="#AA00CC">✦ ✦ ✦</text>';
    }
  },
  {
    label: 'Thinking 🤔',
    sub: 'Hmm…',
    bg: '#E2F0CB',
    color: '#3A7A2A',
    sound: 392,
    svg: function(bg) {
      return '<circle cx="100" cy="100" r="90" fill="' + bg + '" stroke="#333" stroke-width="5"/>'
        + circle(72, 88, 11, '#333')
        + circle(128, 85, 11, '#333')
        + circle(75, 85, 3, '#fff')
        + circle(131, 82, 3, '#fff')
        + path('M 65 120 Q 85 110 110 118 Q 125 122 132 116', 'none', '#333', 5)
        + path('M 128 72 Q 140 62 148 66', 'none', '#333', 4)
        + circle(152, 58, 8, '#555')
        + '<text x="152" y="62" font-size="10" text-anchor="middle" fill="#fff">?</text>';
    }
  },
  {
    label: 'Laughing! 😂',
    sub: 'Ha ha ha!',
    bg: '#FFF176',
    color: '#E65100',
    sound: 698,
    svg: function(bg) {
      return '<circle cx="100" cy="100" r="90" fill="' + bg + '" stroke="#333" stroke-width="5"/>'
        + path('M 58 78 Q 72 65 84 78', 'none', '#333', 5)
        + path('M 116 78 Q 130 65 142 78', 'none', '#333', 5)
        + path('M 55 108 Q 100 160 145 108', '#FF5544', '#333', 5)
        + path('M 68 120 L 132 120', 'none', '#fff', 3)
        + ellipse(75, 125, 8, 5, '#fff', 'none', 0)
        + ellipse(100, 126, 8, 5, '#fff', 'none', 0)
        + ellipse(125, 125, 8, 5, '#fff', 'none', 0)
        + circle(60, 110, 14, '#FF9999', 'none', 0)
        + circle(140, 110, 14, '#FF9999', 'none', 0)
        + path('M 62 95 Q 72 88 64 82', 'none', '#666', 3)
        + path('M 138 95 Q 128 88 136 82', 'none', '#666', 3);
    }
  },
  {
    label: 'Kissy! 😘',
    sub: 'Mwah!',
    bg: '#FFD6E7',
    color: '#C2185B',
    sound: 587,
    svg: function(bg) {
      return '<circle cx="100" cy="100" r="90" fill="' + bg + '" stroke="#333" stroke-width="5"/>'
        + circle(72, 82, 12, '#333')
        + circle(131, 82, 10, '#333')
        + circle(75, 79, 4, '#fff')
        + circle(133, 79, 3, '#fff')
        + path('M 65 112 Q 100 130 135 112', 'none', '#333', 5)
        + ellipse(75, 118, 8, 5, '#FF6699', 'none', 0)
        + ellipse(125, 118, 8, 5, '#FF6699', 'none', 0)
        + ellipse(100, 124, 12, 9, '#FF3380', '#333', 3)
        + '<text x="150" y="80" font-size="20">💋</text>'
        + '<text x="158" y="60" font-size="14">💕</text>';
    }
  }
];

var current = 0;

function buildDots() {
  var el = document.getElementById('dots');
  el.innerHTML = '';
  FACES.forEach(function(f, i) {
    var d = document.createElement('div');
    d.className = 'dot' + (i === current ? ' active' : '');
    d.style.background = i === current ? f.color : '#ddd';
    el.appendChild(d);
  });
}

function showFace(idx) {
  current = (idx + FACES.length) % FACES.length;
  var f = FACES[current];
  var svg = document.getElementById('faceSvg');
  svg.innerHTML = f.svg(f.bg);
  document.getElementById('faceLabel').textContent = f.label;
  document.getElementById('faceLabel').style.color = f.color;
  document.getElementById('faceSub').textContent = f.sub;

  var wrap = document.getElementById('faceWrap');
  wrap.classList.remove('bounce');
  void wrap.offsetWidth;
  wrap.classList.add('bounce');

  document.body.style.background = f.bg;

  buildDots();
  playChime(f.sound);
}

function nextFace() {
  showFace(current + 1);
}

showFace(0);
</script>
</body>
</html>
