<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Solid Foods · Baby & Me</title>
<style>
  :root {
    --pp: #FF7B54; --pl: #FFF0EA; --bg: #FFF9F5;
    --text: #3D3D3D; --muted: #999; --white: #fff;
    --shadow: 0 4px 20px rgba(0,0,0,0.08); --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 80px; }
  .topbar { display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: var(--white); box-shadow: 0 1px 8px rgba(0,0,0,0.06); }
  .back { text-decoration: none; color: var(--pp); font-size: 1.4rem; }
  .topbar h2 { font-size: 1rem; font-weight: 700; }
  .topbar .count { margin-left: auto; font-size: 0.8rem; color: var(--muted); font-weight: 600; }

  .wrap { max-width: 520px; margin: 0 auto; padding: 20px 16px; }

  /* Category tabs */
  .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 20px; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex-shrink: 0; padding: 7px 16px; border-radius: 30px;
    border: 2px solid #e8e0d8; background: var(--white);
    font-size: 0.78rem; font-weight: 700; cursor: pointer;
    font-family: inherit; color: var(--muted); transition: all 0.15s;
  }
  .tab.active { border-color: var(--pp); background: var(--pl); color: var(--pp); }

  /* Food grid */
  .food-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 28px; }

  .food-card {
    background: var(--white); border-radius: var(--radius);
    padding: 14px 10px; text-align: center; box-shadow: var(--shadow);
    cursor: pointer; transition: all 0.15s; border: 2px solid transparent;
    position: relative; font-family: inherit;
  }
  .food-card:active { transform: scale(0.96); }
  .food-card.tried { border-color: #4CAF50; background: #F1FFF3; }
  .food-card.reaction { border-color: #F44336; background: #FFF3F3; }
  .food-card .fc-emoji { font-size: 2rem; display: block; margin-bottom: 6px; }
  .food-card .fc-name { font-size: 0.72rem; font-weight: 700; color: var(--text); line-height: 1.3; }
  .food-card .fc-date { font-size: 0.62rem; color: var(--muted); margin-top: 3px; }
  .food-card .check { position: absolute; top: 6px; right: 8px; font-size: 0.9rem; }

  /* Log section */
  .section-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 12px; }

  .log-list { display: flex; flex-direction: column; gap: 10px; }
  .log-item {
    background: var(--white); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
    display: flex; align-items: center; gap: 12px;
  }
  .log-item .li-emoji { font-size: 1.8rem; flex-shrink: 0; }
  .log-item .li-info { flex: 1; }
  .log-item .li-name { font-size: 0.88rem; font-weight: 700; }
  .log-item .li-meta { font-size: 0.72rem; color: var(--muted); margin-top: 2px; }
  .log-item .li-badge {
    font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 20px;
  }
  .badge-ok { background: #E8F5E9; color: #388E3C; }
  .badge-reaction { background: #FFEBEE; color: #D32F2F; }
  .empty-log { text-align: center; color: var(--muted); font-size: 0.85rem; padding: 24px; }

  /* Modal */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5);
    z-index: 100; align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--white); border-radius: 24px 24px 0 0;
    padding: 24px 20px 36px; width: 100%; max-width: 520px;
    animation: slideUp 0.28s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-title { font-size: 1.1rem; font-weight: 800; margin-bottom: 6px; display: flex; align-items: center; gap: 10px; }
  .modal-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 20px; }

  .reaction-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .rx-btn {
    flex: 1; padding: 12px; border-radius: var(--radius); border: 2px solid #e8e0d8;
    background: var(--white); font-size: 0.82rem; font-weight: 700;
    cursor: pointer; font-family: inherit; color: var(--muted); transition: all 0.15s;
    display: flex; align-items: center; justify-content: center; gap: 6px;
  }
  .rx-btn.sel-ok { border-color: #4CAF50; background: #F1FFF3; color: #388E3C; }
  .rx-btn.sel-reaction { border-color: #F44336; background: #FFF3F3; color: #C62828; }

  .note-input {
    width: 100%; padding: 12px 14px; border-radius: var(--radius);
    border: 2px solid #e8e0d8; font-family: inherit; font-size: 0.88rem;
    background: var(--bg); color: var(--text); margin-bottom: 16px;
    outline: none; resize: none;
  }
  .note-input:focus { border-color: var(--pp); }

  .modal-actions { display: flex; gap: 10px; }
  .btn-save {
    flex: 1; padding: 14px; border-radius: var(--radius);
    background: var(--pp); color: #fff; border: none;
    font-size: 0.9rem; font-weight: 800; cursor: pointer; font-family: inherit;
    transition: opacity 0.15s;
  }
  .btn-save:active { opacity: 0.8; }
  .btn-remove {
    padding: 14px 18px; border-radius: var(--radius);
    background: #FFEBEE; color: #C62828; border: none;
    font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn-cancel {
    padding: 14px 18px; border-radius: var(--radius);
    background: #f0f0f0; color: var(--muted); border: none;
    font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit;
  }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="back" onclick="history.back();return false;">←</a>
  <h2>🥄 Solid Foods Tracker</h2>
  <span class="count" id="triedCount">0 tried</span>
</div>
<div class="wrap">
  <div class="tabs" id="tabs"></div>
  <div class="food-grid" id="foodGrid"></div>
  <div class="section-title">📋 Introduction Log</div>
  <div class="log-list" id="logList"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="maybeClose(event)">
  <div class="modal" id="modal">
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="reaction-row">
      <button class="rx-btn" id="rxOk" onclick="selectRx('ok')">✅ Liked it</button>
      <button class="rx-btn" id="rxReaction" onclick="selectRx('reaction')">⚠️ Reaction</button>
    </div>
    <textarea class="note-input" id="noteInput" rows="2" placeholder="Notes (optional)…"></textarea>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-remove" id="btnRemove" onclick="removeFood()" style="display:none">Remove</button>
      <button class="btn-save" onclick="saveFood()">Save</button>
    </div>
  </div>
</div>

<script>
var STORAGE_KEY = 'solid_foods_v1';
var CATS = {
  'All': null,
  '🥦 Veggies': ['Carrot','Pea','Broccoli','Pumpkin','Sweet Potato','Zucchini','Spinach','Beetroot','Cauliflower','Green Bean'],
  '🍎 Fruits': ['Apple','Banana','Pear','Mango','Avocado','Peach','Blueberry','Strawberry','Watermelon','Papaya'],
  '🌾 Grains': ['Rice Cereal','Oat Cereal','Barley Porridge','Bread','Pasta','Quinoa'],
  '🍗 Protein': ['Chicken','Turkey','Lentils','Tofu','Egg Yolk','Salmon','Chickpeas','Beef'],
  '🥛 Dairy': ['Yogurt','Cottage Cheese','Cheese','Ghee']
};

var FOOD_EMOJIS = {
  'Carrot':'🥕','Pea':'🫛','Broccoli':'🥦','Pumpkin':'🎃','Sweet Potato':'🍠',
  'Zucchini':'🥒','Spinach':'🌿','Beetroot':'🫐','Cauliflower':'🥬','Green Bean':'🫘',
  'Apple':'🍎','Banana':'🍌','Pear':'🍐','Mango':'🥭','Avocado':'🥑',
  'Peach':'🍑','Blueberry':'🫐','Strawberry':'🍓','Watermelon':'🍉','Papaya':'🧡',
  'Rice Cereal':'🍚','Oat Cereal':'🥣','Barley Porridge':'🫙','Bread':'🍞','Pasta':'🍝','Quinoa':'🌾',
  'Chicken':'🍗','Turkey':'🦃','Lentils':'🫘','Tofu':'⬜','Egg Yolk':'🥚','Salmon':'🐟','Chickpeas':'🫛','Beef':'🥩',
  'Yogurt':'🍦','Cottage Cheese':'🧀','Cheese':'🧀','Ghee':'🧈'
};

var data = {};
var currentCat = 'All';
var modalFood = null;
var selectedRx = null;

function load() {
  try { data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}'); } catch(e) { data = {}; }
}
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

function allFoods() {
  var arr = [];
  Object.keys(CATS).forEach(function(cat) {
    if (cat === 'All') return;
    CATS[cat].forEach(function(f) { if (arr.indexOf(f) === -1) arr.push(f); });
  });
  return arr;
}

function getFoods() {
  if (currentCat === 'All') return allFoods();
  return CATS[currentCat] || [];
}

function renderTabs() {
  var el = document.getElementById('tabs');
  el.innerHTML = '';
  Object.keys(CATS).forEach(function(cat) {
    var btn = document.createElement('button');
    btn.className = 'tab' + (cat === currentCat ? ' active' : '');
    btn.textContent = cat;
    btn.onclick = function() { currentCat = cat; renderTabs(); renderGrid(); };
    el.appendChild(btn);
  });
}

function renderGrid() {
  var foods = getFoods();
  var el = document.getElementById('foodGrid');
  el.innerHTML = '';
  foods.forEach(function(name) {
    var entry = data[name];
    var card = document.createElement('button');
    var emoji = FOOD_EMOJIS[name] || '🍽️';
    var cls = 'food-card' + (entry ? (entry.rx === 'reaction' ? ' reaction' : ' tried') : '');
    card.className = cls;
    card.innerHTML = '<span class="fc-emoji">' + emoji + '</span>'
      + '<span class="fc-name">' + name + '</span>'
      + (entry ? '<span class="fc-date">' + entry.date + '</span>' : '')
      + (entry ? '<span class="check">' + (entry.rx === 'reaction' ? '⚠️' : '✅') + '</span>' : '');
    card.onclick = function() { openModal(name, entry); };
    el.appendChild(card);
  });

  // Update count
  var tried = Object.keys(data).length;
  document.getElementById('triedCount').textContent = tried + ' tried';

  renderLog();
}

function renderLog() {
  var el = document.getElementById('logList');
  var entries = Object.keys(data).map(function(name) {
    return { name: name, emoji: FOOD_EMOJIS[name] || '🍽️', date: data[name].date, rx: data[name].rx, note: data[name].note };
  }).sort(function(a, b) { return b.date.localeCompare(a.date); });

  if (entries.length === 0) {
    el.innerHTML = '<div class="empty-log">No foods logged yet. Tap a food to record it!</div>';
    return;
  }

  el.innerHTML = '';
  entries.forEach(function(e) {
    var item = document.createElement('div');
    item.className = 'log-item';
    var badgeClass = e.rx === 'reaction' ? 'li-badge badge-reaction' : 'li-badge badge-ok';
    var badgeText = e.rx === 'reaction' ? '⚠️ Reaction' : '✅ Liked it';
    item.innerHTML = '<span class="li-emoji">' + e.emoji + '</span>'
      + '<div class="li-info"><div class="li-name">' + e.name + '</div>'
      + '<div class="li-meta">' + e.date + (e.note ? ' · ' + e.note : '') + '</div></div>'
      + '<span class="' + badgeClass + '">' + badgeText + '</span>';
    el.appendChild(item);
  });
}

function openModal(name, entry) {
  modalFood = name;
  selectedRx = entry ? entry.rx : null;
  var emoji = FOOD_EMOJIS[name] || '🍽️';
  document.getElementById('modalTitle').innerHTML = emoji + ' ' + name;
  document.getElementById('modalSub').textContent = entry ? 'First tried: ' + entry.date : 'Mark as introduced today';
  document.getElementById('noteInput').value = entry ? (entry.note || '') : '';
  document.getElementById('btnRemove').style.display = entry ? 'block' : 'none';
  updateRxButtons();
  document.getElementById('modalOverlay').classList.add('open');
}

function selectRx(rx) {
  selectedRx = rx;
  updateRxButtons();
}

function updateRxButtons() {
  document.getElementById('rxOk').className = 'rx-btn' + (selectedRx === 'ok' ? ' sel-ok' : '');
  document.getElementById('rxReaction').className = 'rx-btn' + (selectedRx === 'reaction' ? ' sel-reaction' : '');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  modalFood = null; selectedRx = null;
}

function maybeClose(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}

function todayStr() {
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function saveFood() {
  if (!modalFood) return;
  var rx = selectedRx || 'ok';
  data[modalFood] = {
    date: data[modalFood] ? data[modalFood].date : todayStr(),
    rx: rx,
    note: document.getElementById('noteInput').value.trim()
  };
  save();
  closeModal();
  renderGrid();
}

function removeFood() {
  if (!modalFood) return;
  delete data[modalFood];
  save();
  closeModal();
  renderGrid();
}

load();
renderTabs();
renderGrid();
</script>
</body>
</html>
