<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirror · Baby & Me</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #000; min-height: 100vh; overflow: hidden; }

  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }

  /* Decorative frame overlay */
  #frame-overlay { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #frame-overlay svg { width: 100%; height: 100%; }

  .topbar { position: fixed; top: 0; left: 0; right: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent); }
  .back { text-decoration: none; color: rgba(255,255,255,0.8); font-size: 1.2rem; background: rgba(255,255,255,0.15); border-radius: 8px; padding: 4px 10px; }
  .topbar h2 { font-size: 0.85rem; font-weight: 600; color: rgba(255,255,255,0.7); }

  #no-cam { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #1a1a2e; color: white; text-align: center; padding: 40px; z-index: 30; }
  #no-cam .nc-icon { font-size: 4rem; margin-bottom: 16px; }
  #no-cam h3 { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
  #no-cam p { font-size: 0.85rem; color: rgba(255,255,255,0.6); line-height: 1.6; }
  #retry-btn { margin-top: 20px; padding: 12px 24px; background: #5BB8B0; color: white; border: none; border-radius: 12px; font-size: 0.9rem; font-weight: 700; cursor: pointer; font-family: inherit; }

  /* Reactions */
  #reactions { position: fixed; z-index: 15; pointer-events: none; inset: 0; }
  .reaction { position: absolute; font-size: 2.5rem; animation: floatUp 1.5s ease-out forwards; pointer-events: none; }
  @keyframes floatUp { 0%{opacity:1;transform:translateY(0) scale(1)} 100%{opacity:0;transform:translateY(-120px) scale(1.5)} }

  .controls { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); z-index: 20; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .ctrl-btn {
    padding: 12px 20px; border-radius: 28px; border: 2px solid rgba(255,255,255,0.3);
    background: rgba(255,255,255,0.15); color: white; font-size: 1rem; font-weight: 700;
    cursor: pointer; font-family: inherit; backdrop-filter: blur(8px); transition: all 0.15s;
  }
  .ctrl-btn:active { transform: scale(0.93); background: rgba(255,255,255,0.3); }

  /* Filter buttons */
  .filters { position: fixed; right: 16px; top: 50%; transform: translateY(-50%); z-index: 20; display: flex; flex-direction: column; gap: 8px; }
  .filter-btn { width: 44px; height: 44px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); background: rgba(255,255,255,0.12); color: white; font-size: 1.1rem; cursor: pointer; backdrop-filter: blur(4px); transition: all 0.15s; display: flex; align-items: center; justify-content: center; }
  .filter-btn:active { transform: scale(0.9); }
  .filter-btn.active { background: rgba(255,255,255,0.4); border-color: white; }
</style>
</head>
<body>
<div class="topbar">
  <a href="index.html" class="back">←</a>
  <h2>🪞 Baby Mirror</h2>
  <div style="width:44px"></div>
</div>

<video id="video" autoplay playsinline muted></video>
<div id="frame-overlay"></div>
<div id="reactions"></div>

<div id="no-cam" style="display:none">
  <div class="nc-icon">📷</div>
  <h3>Camera Access Needed</h3>
  <p>The mirror needs your front camera.<br>Please allow camera access when prompted.</p>
  <button id="retry-btn" onclick="startCamera()">Allow & Try Again</button>
</div>

<div class="filters" id="filters">
  <button class="filter-btn active" onclick="setFilter('none',this)" title="Normal">🪞</button>
  <button class="filter-btn" onclick="setFilter('warm',this)" title="Warm">🌅</button>
  <button class="filter-btn" onclick="setFilter('cool',this)" title="Cool">❄️</button>
  <button class="filter-btn" onclick="setFilter('bw',this)" title="B&W">◼</button>
  <button class="filter-btn" onclick="setFilter('dream',this)" title="Dreamy">✨</button>
</div>

<div class="controls">
  <button class="ctrl-btn" onclick="playReaction('giggle')">😂 Giggle</button>
  <button class="ctrl-btn" onclick="playReaction('kiss')">😘 Kiss</button>
  <button class="ctrl-btn" onclick="playReaction('clap')">👏 Clap</button>
  <button class="ctrl-btn" onclick="playReaction('star')">⭐ Stars</button>
</div>

<script>
let audioCtx = null;

function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

async function startCamera() {
  document.getElementById('no-cam').style.display = 'none';
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
    document.getElementById('video').srcObject = stream;
  } catch(e) {
    document.getElementById('no-cam').style.display = 'flex';
  }
}

function setFilter(type, btn) {
  const video = document.getElementById('video');
  const filters = { none: '', warm: 'sepia(0.3) saturate(1.5) hue-rotate(-15deg)', cool: 'hue-rotate(30deg) saturate(0.9) brightness(1.05)', bw: 'grayscale(1) contrast(1.1)', dream: 'blur(1px) brightness(1.1) saturate(1.4) contrast(0.9)' };
  video.style.filter = `scaleX(-1) ${filters[type]}`;
  video.style.transform = 'scaleX(-1)';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function playReaction(type) {
  ensureAudio();
  const sounds = {
    giggle: () => {
      const t = audioCtx.currentTime;
      for (let i = 0; i < 5; i++) {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.value = 650 + Math.random() * 250;
        g.gain.setValueAtTime(0.25, t+i*0.1); g.gain.exponentialRampToValueAtTime(0.001, t+i*0.1+0.09);
        o.connect(g); g.connect(audioCtx.destination); o.start(t+i*0.1); o.stop(t+i*0.1+0.1);
      }
    },
    kiss: () => {
      const t = audioCtx.currentTime;
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.setValueAtTime(800, t); o.frequency.exponentialRampToValueAtTime(200, t+0.3);
      g.gain.setValueAtTime(0.3, t); g.gain.linearRampToValueAtTime(0.4, t+0.05); g.gain.exponentialRampToValueAtTime(0.001, t+0.35);
      o.connect(g); g.connect(audioCtx.destination); o.start(t); o.stop(t+0.4);
    },
    clap: () => {
      const t = audioCtx.currentTime;
      for (let i = 0; i < 3; i++) {
        const buf = audioCtx.createBuffer(1, audioCtx.sampleRate*0.1, audioCtx.sampleRate);
        const d = buf.getChannelData(0);
        for (let j = 0; j < d.length; j++) d[j] = (Math.random()*2-1) * Math.max(0, 1 - j/(d.length*0.7));
        const s = audioCtx.createBufferSource(), g = audioCtx.createGain();
        s.buffer = buf; g.gain.value = 0.6;
        const f = audioCtx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1200; f.Q.value=0.5;
        s.connect(f); f.connect(g); g.connect(audioCtx.destination);
        s.start(t + i*0.22);
      }
    },
    star: () => {
      const t = audioCtx.currentTime;
      [523,659,784,1047].forEach((f,i) => {
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'triangle'; o.frequency.value = f;
        g.gain.setValueAtTime(0.2, t+i*0.1); g.gain.exponentialRampToValueAtTime(0.001, t+i*0.1+0.4);
        o.connect(g); g.connect(audioCtx.destination); o.start(t+i*0.1); o.stop(t+i*0.1+0.45);
      });
    }
  };
  sounds[type]?.();

  // Visual reaction
  const emojis = { giggle:['😂','🤣','😄'], kiss:['😘','💋','❤️'], clap:['👏','🎉','✨'], star:['⭐','🌟','✨','💫'] };
  const container = document.getElementById('reactions');
  for (let i = 0; i < 5; i++) {
    setTimeout(() => {
      const div = document.createElement('div'); div.className = 'reaction';
      div.textContent = emojis[type][Math.floor(Math.random()*emojis[type].length)];
      div.style.left = `${10 + Math.random() * 80}%`;
      div.style.top = `${20 + Math.random() * 60}%`;
      container.appendChild(div);
      setTimeout(() => div.remove(), 1600);
    }, i * 120);
  }
}

document.getElementById('video').addEventListener('click', () => {
  const types = ['giggle','kiss','clap','star'];
  playReaction(types[Math.floor(Math.random()*types.length)]);
});

startCamera();
</script>
</body>
</html>
